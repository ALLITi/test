<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="info">
      <h1>Snake</h1>
      <p>Use the arrow keys or WASD to guide the snake toward the food. Avoid colliding with the walls or yourself.</p>
      <div class="stats">
        <div class="status">
          <div class="label">Score</div>
          <div id="score" class="value">0</div>
        </div>
        <div class="status">
          <div class="label">High score</div>
          <div id="high-score" class="value">0</div>
        </div>
      </div>
      <button id="restart" aria-label="Restart game">Restart</button>
    </section>
    <section class="board">
      <canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
